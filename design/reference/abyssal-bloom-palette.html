<div id="abyssal-palette" aria-label="Abyssal Bloom 八色色板与建议用途">
<style>
#abyssal-palette .colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 18px}
#abyssal-palette .swatch{height:90px;margin-bottom:8px}
#abyssal-palette .label{font-weight:500}
#abyssal-palette .use{color:var(--muted-foreground)}
@media(max-width:480px){#abyssal-palette .colors{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<div class="colors">
<div><div class="swatch" style="background:#010206"></div><div class="label">深渊黑 · Background</div><code>#010206</code><div class="use">页面主背景、动画画布</div></div>
<div><div class="swatch" style="background:#042156"></div><div class="label">深海蓝 · Surface</div><code>#042156</code><div class="use">内容区、卡片底色</div></div>
<div><div class="swatch" style="background:#3A5362"></div><div class="label">岩灰蓝 · Border</div><code>#3A5362</code><div class="use">分隔线、辅助图形</div></div>
<div><div class="swatch" style="background:#1745A4"></div><div class="label">钴蓝 · Primary</div><code>#1745A4</code><div class="use">主要按钮、选中区域</div></div>
<div><div class="swatch" style="background:#06619B"></div><div class="label">海洋蓝 · Secondary</div><code>#06619B</code><div class="use">次级图形、图表系列</div></div>
<div><div class="swatch" style="background:#1899C5"></div><div class="label">亮青蓝 · Highlight</div><code>#1899C5</code><div class="use">涟漪、交互高亮、数据点</div></div>
<div><div class="swatch" style="background:#C9CCD1"></div><div class="label">雾银白 · Text</div><code>#C9CCD1</code><div class="use">标题、正文、重要标签</div></div>
<div><div class="swatch" style="background:#9F705D"></div><div class="label">暖铜棕 · Contrast</div><code>#9F705D</code><div class="use">少量对比标记、特殊类别</div></div>
</div>
</div>
